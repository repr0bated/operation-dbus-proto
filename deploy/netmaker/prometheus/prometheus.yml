global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
alerting:
  alertmanagers:
  - static_configs:
    - targets: []
    scheme: http
    timeout: 10s
    api_version: v2
scrape_configs:
- job_name: netmaker
  honor_timestamps: true
  scrape_interval: 15s
  scrape_timeout: 10s
  metrics_path: /prometheus/metrics
  scheme: __SCHEME__
  basic_auth:
      username: METRICS_USERNAME
      password: METRICS_SECRET
  static_configs:
  - targets:
    - NETMAKER_METRICS_TARGET  # fetch metrics from netmaker-enterprise server
