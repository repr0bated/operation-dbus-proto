# Host Mosquitto for the no-NIC Netmaker app container.
# Incus loopback proxy exposes these listeners inside the container as 127.0.0.1.
listener 1883 127.0.0.1
protocol websockets

listener 8883 127.0.0.1
protocol websockets

allow_anonymous false
password_file /etc/netmaker/mosquitto-password.txt
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
