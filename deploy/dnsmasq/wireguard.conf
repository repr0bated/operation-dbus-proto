# Deprecated fallback only. The socket networking spec uses NextDNS profile
# 689ec7 with a DNS Rewrite for dashboard.3tched.com -> 10.0.0.1.
# Do not install this file on the current host unless NextDNS is unavailable.
#
# DNS for WireGuard clients only
interface=wg0
bind-interfaces

# Only answer queries from WireGuard network
except-interface=lo
except-interface=eth0
except-interface=ens3

# DNS rewrite for dashboard
address=/dashboard.3tched.com/10.0.0.1

# Upstream DNS
server=1.1.1.1
no-resolv

# Don't read /etc/hosts for this instance
no-hosts
