<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- OP-DBUS System Bus Configuration
       All org.opdbus.* names are owned by the op-dbus service.
       Any local user may call them — access control is enforced
       by the service itself, not the bus policy layer. -->

  <policy user="root">
    <allow own_prefix="org.opdbus"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>

  <policy user="jeremy">
    <allow own_prefix="org.opdbus"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>

  <!-- Default: allow sending to any org.opdbus.* destination on any interface.
       The wildcard send_destination="*" is intentionally broad — this is a
       local session bus equivalent on the system bus; real authz happens
       inside the service via capability checks. -->
  <policy context="default">
    <allow send_destination="org.opdbus"/>
    <allow send_destination="org.opdbus.v1.plugins"/>
    <allow send_destination="org.opdbus.Projection"/>
    <allow send_destination="org.opdbus.services"/>
    <allow send_destination="org.opdbus.network"/>
    <allow send_destination="org.opdbus.security"/>
    <allow send_destination="org.opdbus.config"/>
    <allow send_destination="org.opdbus.policy"/>
    <allow send_destination="org.opdbus.storage"/>
    <allow send_destination="org.opdbus.backup"/>
    <allow send_destination="org.opdbus.container"/>
    <allow send_destination="org.opdbus.virtualization"/>
    <allow send_destination="org.opdbus.monitoring"/>
    <allow send_destination="org.opdbus.hardware"/>
    <allow send_destination="org.opdbus.ipmi"/>
    <allow send_destination="org.opdbus.bmc"/>
    <allow send_destination="org.opdbus.cluster"/>
    <allow send_destination="org.opdbus.cms"/>
    <allow send_destination="org.opdbus.session"/>
    <allow send_destination="org.opdbus.directory"/>
  </policy>
</busconfig>
