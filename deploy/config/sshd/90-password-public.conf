# Public listen + password login without waiting on NetMaker.
# Installed to /etc/ssh/sshd_config.d/90-singleuser-password.conf.
# The old 10-netmaker-only.conf pinned ListenAddress 100.69.0.1 and
# PermitRootLogin no; leave that file disabled (.off-*).
ListenAddress 0.0.0.0
AddressFamily inet
PasswordAuthentication yes
KbdInteractiveAuthentication yes
PermitRootLogin yes
PubkeyAuthentication yes
UsePAM yes
LogLevel VERBOSE
