#!/usr/bin/nft -f
# 3tched host firewall (Artix/runit)
# Default deny INPUT; allow SSH, loopback, ICMP, and 3tched mesh control-plane ports.
# Public SNI path: client → decoy :443 → mesh 100.69.0.254:8444 → host xray → backends.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    tcp dport ssh accept comment "allow sshd"

    # WireGuard mesh (3tched) peers
    udp dport 51821 accept comment "wg-3tched"
    tcp dport { 25, 80, 143, 443, 465, 587, 993 } accept comment "mail smtp/imap/web"

    # Mesh fabric from decoy/clients (100.69.0.0/16)
    # 8444 = xray xhttp (dashboard/qdrant/assistant SNI via decoy web-bridge)
    # 8080/8090 = op-web / gRPC side channels
    # 6333/6334 = qdrant (mesh-only direct)
    # 8081/8083/3003 = netmaker / cognitive side channels
    ip saddr 100.69.0.0/16 tcp dport {
      8444, 8080, 8090, 8091, 6333, 6334, 8081, 8083, 3003, 28082
    } accept comment "3tched mesh service ports"
    tcp dport 8443 accept comment "netmaker enrollment API"
    tcp dport 8444 accept comment "decoy xhttp bridge"

    # Internal OVS service segment (xray 10.200.0.1, host 10.200.0.2)
    ip saddr 10.200.0.0/24 accept comment "ovs svc0 fabric"

    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
    # allow container/host hairpin on service net if needed later
    ct state {established, related} accept
    ip saddr 10.200.0.0/24 ip daddr 10.200.0.0/24 accept
  }
}

# --- MSS clamping for tunnel egress (added 2026-08-10; OUTPUT added same day) ---
# ovsbr0 + ports are MTU 1500; netmaker 1420, wgcf-egress 1280.
# FORWARD covers container/routed traffic; OUTPUT covers host-originated
# mesh/peer TCP (MQTT, IMAP, bridge) which never hits FORWARD.
# "size set rt mtu" derives the clamp from the route MTU.
# Independent table: remove with `nft delete table inet mangle`.
destroy table inet mangle
table inet mangle {
  chain forward {
    type filter hook forward priority mangle; policy accept;
    oifname "netmaker"    tcp flags syn counter tcp option maxseg size set 1300 comment "clamp MSS 1300 - mobile peers path MTU 1376, rt mtu (1420) is too generous"
    oifname "wgcf-egress" tcp flags syn counter tcp option maxseg size set rt mtu comment "clamp MSS to warp path MTU (1280)"
  }
  chain output {
    type filter hook output priority mangle; policy accept;
    oifname "netmaker"    tcp flags syn counter tcp option maxseg size set 1300 comment "clamp host-originated MSS 1300 - mobile peers path MTU 1376"
    oifname "wgcf-egress" tcp flags syn counter tcp option maxseg size set rt mtu comment "clamp host-originated MSS to warp path MTU (1280)"
  }
}
