#!/usr/bin/nft -f
# 3tched host firewall (Artix/runit)
# Default deny INPUT; allow loopback, ICMP, public services, and the decoy Xray door.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"
    meta l4proto { icmp, icmpv6 } accept comment "allow icmp"
    tcp dport { 25, 80, 143, 443, 465, 587, 993 } accept comment "mail smtp/imap/web"
    tcp dport 8444 accept comment "decoy xhttp bridge"

    # Internal OVS service segment (xray 10.200.0.1, host 10.200.0.2)
    ip saddr 10.200.0.0/24 accept comment "ovs svc0 fabric"

    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
    # allow container/host hairpin on service net if needed later
    ct state {established, related} accept
    ip saddr 10.200.0.0/24 ip daddr 10.200.0.0/24 accept
  }
}

# --- MSS clamping for tunnel egress (added 2026-08-10; OUTPUT added same day) ---
# Fabric paths own their MTU; no host WireGuard interface is assumed.
# FORWARD covers container/routed traffic; OUTPUT covers host-originated
# mesh/peer TCP (MQTT, IMAP, bridge) which never hits FORWARD.
# "size set rt mtu" derives the clamp from the route MTU.
# Independent table: remove with `nft delete table inet mangle`.
destroy table inet mangle
table inet mangle {
  chain forward {
    type filter hook forward priority mangle; policy accept;
  }
  chain output {
    type filter hook output priority mangle; policy accept;
  }
}
