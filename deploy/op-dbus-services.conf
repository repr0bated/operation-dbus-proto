<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- 
    Operation D-Bus Services Policy Configuration
    Install to: /etc/dbus-1/system.d/op-dbus-services.conf
  -->

  <!-- Allow root full access to all org.opdbus services -->
  <policy user="root">
    <allow own_prefix="org.opdbus"/>
    <allow send_destination_prefix="org.opdbus"/>
    <allow receive_sender="org.opdbus"/>
  </policy>

  <!-- Allow op-dbus user to own and send to services -->
  <policy user="op-dbus">
    <allow own_prefix="org.opdbus"/>
    <allow send_destination_prefix="org.opdbus"/>
    <allow receive_sender="org.opdbus"/>
  </policy>

  <!-- Default policy: allow introspection and read operations -->
  <policy context="default">
    <!-- Introspection for all services -->
    <allow send_destination_prefix="org.opdbus"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination_prefix="org.opdbus"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination_prefix="org.opdbus"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>

    <!-- org.opdbus.config read operations -->
    <allow send_destination="org.opdbus.config"
           send_interface="org.opdbus.Config"
           send_member="Get"/>
    <allow send_destination="org.opdbus.config"
           send_interface="org.opdbus.Config"
           send_member="GetSection"/>
    <allow send_destination="org.opdbus.config"
           send_interface="org.opdbus.Config"
           send_member="ListSections"/>
    <allow send_destination="org.opdbus.config"
           send_interface="org.opdbus.Config"
           send_member="GetSchema"/>

    <!-- org.opdbus.network read operations -->
    <allow send_destination="org.opdbus.network"
           send_interface="org.opdbus.Network"
           send_member="ListInterfaces"/>
    <allow send_destination="org.opdbus.network"
           send_interface="org.opdbus.Network"
           send_member="GetInterface"/>
    <allow send_destination="org.opdbus.network"
           send_interface="org.opdbus.Network"
           send_member="ListBridges"/>

    <!-- org.opdbus.hardware read operations -->
    <allow send_destination="org.opdbus.hardware"
           send_interface="org.opdbus.Hardware"
           send_member="ListDevices"/>
    <allow send_destination="org.opdbus.hardware"
           send_interface="org.opdbus.Hardware"
           send_member="GetDevice"/>
    <allow send_destination="org.opdbus.hardware"
           send_interface="org.opdbus.Hardware"
           send_member="GetSensors"/>
    <allow send_destination="org.opdbus.hardware"
           send_interface="org.opdbus.Hardware"
           send_member="GetPowerStatus"/>

    <!-- org.opdbus.container read operations -->
    <allow send_destination="org.opdbus.container"
           send_interface="org.opdbus.Container"
           send_member="ListContainers"/>
    <allow send_destination="org.opdbus.container"
           send_interface="org.opdbus.Container"
           send_member="GetContainerState"/>

    <!-- org.opdbus.session read operations -->
    <allow send_destination="org.opdbus.session"
           send_interface="org.opdbus.Session"
           send_member="ListSessions"/>
    <allow send_destination="org.opdbus.session"
           send_interface="org.opdbus.Session"
           send_member="GetSession"/>
    <allow send_destination="org.opdbus.session"
           send_interface="org.opdbus.Session"
           send_member="ListUsers"/>

    <!-- org.opdbus.policy read operations -->
    <allow send_destination="org.opdbus.policy"
           send_interface="org.opdbus.Policy"
           send_member="ListPolicies"/>
    <allow send_destination="org.opdbus.policy"
           send_interface="org.opdbus.Policy"
           send_member="GetPolicy"/>
    <allow send_destination="org.opdbus.policy"
           send_interface="org.opdbus.Policy"
           send_member="GetCompliance"/>
    <allow send_destination="org.opdbus.policy"
           send_interface="org.opdbus.Policy"
           send_member="ValidateState"/>

    <!-- org.opdbus.directory read operations -->
    <allow send_destination="org.opdbus.directory"
           send_interface="org.opdbus.Directory"
           send_member="Search"/>
    <allow send_destination="org.opdbus.directory"
           send_interface="org.opdbus.Directory"
           send_member="GetEntry"/>

    <!-- org.opdbus.ipmi read operations -->
    <allow send_destination="org.opdbus.ipmi"
           send_interface="org.opdbus.Ipmi"
           send_member="GetSdr"/>
    <allow send_destination="org.opdbus.ipmi"
           send_interface="org.opdbus.Ipmi"
           send_member="GetSel"/>
    <allow send_destination="org.opdbus.ipmi"
           send_interface="org.opdbus.Ipmi"
           send_member="GetChassisStatus"/>

    <!-- org.opdbus.bmc read operations -->
    <allow send_destination="org.opdbus.bmc"
           send_interface="org.opdbus.Bmc"
           send_member="GetSystemInfo"/>
    <allow send_destination="org.opdbus.bmc"
           send_interface="org.opdbus.Bmc"
           send_member="GetHealth"/>
    <allow send_destination="org.opdbus.bmc"
           send_interface="org.opdbus.Bmc"
           send_member="GetSensors"/>
    <allow send_destination="org.opdbus.bmc"
           send_interface="org.opdbus.Bmc"
           send_member="GetLogs"/>
    <allow send_destination="org.opdbus.bmc"
           send_interface="org.opdbus.Bmc"
           send_member="GetVirtualMedia"/>
    <allow send_destination="org.opdbus.bmc"
           send_interface="org.opdbus.Bmc"
           send_member="GetFirmwareInventory"/>
  </policy>

  <!-- Operators group: additional write permissions -->
  <policy group="opdbus-operators">
    <!-- Network management -->
    <allow send_destination="org.opdbus.network"
           send_interface="org.opdbus.Network"/>
    <!-- Container management -->
    <allow send_destination="org.opdbus.container"
           send_interface="org.opdbus.Container"/>
    <!-- Session management -->
    <allow send_destination="org.opdbus.session"
           send_interface="org.opdbus.Session"/>
  </policy>

  <!-- Admins group: full access except IPMI/BMC power control -->
  <policy group="opdbus-admins">
    <allow send_destination_prefix="org.opdbus"/>
    <!-- Explicitly deny dangerous operations -->
    <deny send_destination="org.opdbus.ipmi"
          send_interface="org.opdbus.Ipmi"
          send_member="ChassisControl"/>
    <deny send_destination="org.opdbus.bmc"
          send_interface="org.opdbus.Bmc"
          send_member="SetPowerState"/>
  </policy>
</busconfig>
