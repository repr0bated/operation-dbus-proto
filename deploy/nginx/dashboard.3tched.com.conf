# Legacy filename retained for operators that still reference it manually.
# The active Chimera/nginx install path is /etc/nginx/http.d/dashboard-3tched.conf.

server {
    listen 148.113.204.83:80;
    server_name dashboard.3tched.com;
    return 404;
}

server {
    listen 148.113.204.83:443 ssl;
    http2 on;
    server_name dashboard.3tched.com;

    ssl_certificate /etc/letsencrypt/live/3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3tched.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 404;
}

server {
    listen 10.0.0.1:80;
    server_name dashboard.3tched.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 10.0.0.1:443 ssl;
    http2 on;
    server_name dashboard.3tched.com;

    ssl_certificate /etc/letsencrypt/live/3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3tched.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /gateway/ {
        proxy_pass http://unix:/run/services0/gateway.sock:/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization "Bearer <OPENCLAW_GATEWAY_TOKEN>";
        proxy_read_timeout 7d;
    }
}
