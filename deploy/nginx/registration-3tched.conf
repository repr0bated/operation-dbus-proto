# Reverse proxy for registration.3tched.com
# Uses your Cloudflare credentials from ~/.bash_secrets

upstream registration_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name registration.3tched.com registration.jeremytech.net;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name registration.3tched.com registration.jeremytech.net;

    # Use Let's Encrypt certificate (or Cloudflare origin cert)
    ssl_certificate /etc/letsencrypt/live/registration.3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registration.3tched.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Magic link registration service
    location / {
        proxy_pass http://registration_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for chat
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # Health check
    location /health {
        proxy_pass http://registration_backend/health;
        proxy_set_header Host $host;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://registration_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/registration.3tched.com.access.log;
    error_log /var/log/nginx/registration.3tched.com.error.log;
}
