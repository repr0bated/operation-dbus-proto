## Standalone local broker owned by OP-DBUS, not Netmaker.
## This file is the immutable deployment layer; runtime API writes land under
## /var/lib/emqx/configs and cannot expose a listener outside loopback.

node {
  name = "emqx@127.0.0.1"
  data_dir = "/var/lib/emqx"
}

cluster {
  name = opdbus
  discovery_strategy = manual
}

listeners.tcp.default {
  bind = "127.0.0.1:1883"
  enable_authn = true
  proxy_protocol = false
  max_connections = 1024
}

## Disable every default public listener. MQTT is local-only and the bridge's
## authenticated https://10.0.0.3:8090/mcp remains the sole external MCP door.
listeners.ssl.default.bind = 0
listeners.ws.default.bind = 0
listeners.wss.default.bind = 0
listeners.quic.default.bind = 0

dashboard {
  cors = false
  listeners.http.bind = "127.0.0.1:18083"
  listeners.https.bind = 0
}

authentication = [
  {
    enable = true
    backend = built_in_database
    mechanism = password_based
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
    bootstrap_file = "/var/lib/emqx/bootstrap/auth-built-in-db-bootstrap.csv"
    bootstrap_type = plain
  }
]

authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      enable = true
      path = "/etc/emqx/acl.conf"
    }
  ]
}

## The plugin talks to the management API with this locally generated key;
## dashboard credentials are never reused as machine credentials.
api_key.bootstrap_file = "/var/lib/emqx/bootstrap/api-keys.txt"
