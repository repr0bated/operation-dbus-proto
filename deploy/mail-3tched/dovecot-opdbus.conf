# Included by the prepared mail-3tched dovecot.conf.
# Per-mailbox limits are emitted as passwd-file userdb_quota_rule fields.
passdb {
  driver = passwd-file
  args = scheme=CRYPT username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=@OP_MAIL_VMAIL_UID@ gid=@OP_MAIL_VMAIL_GID@ home=/var/mail/vhosts/%d/%n
}

mail_plugins = $mail_plugins quota

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}

plugin {
  quota = maildir:User quota
}
