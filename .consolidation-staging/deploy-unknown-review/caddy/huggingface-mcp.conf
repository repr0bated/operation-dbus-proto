# Caddy configuration for Hugging Face MCP HTTPS endpoint
# This exposes the MCP server via HTTPS for Hugging Face integration

# Main MCP endpoint - HTTPS for Hugging Face
mcp.ghostbridge.tech {
    # Reverse proxy to op-mcp-agents SSE endpoint
    reverse_proxy localhost:8080/mcp/agents {
        # WebSocket/SSE support
        header_up Upgrade {>Upgrade}
        header_up Connection {>Connection}
        
        # Forward real client IP
        header_up X-Real-IP {remote}
        header_up X-Forwarded-For {remote}
        header_up X-Forwarded-Proto {scheme}
        header_up X-Forwarded-Host {host}
    }

    # Enable compression
    encode gzip zstd

    # Security headers
    header {
        # CORS for Hugging Face
        Access-Control-Allow-Origin "*"
        Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization"
        
        # Enable HSTS
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        X-Frame-Options "SAMEORIGIN"
        X-XSS-Protection "1; mode=block"
        X-Content-Type-Options "nosniff"
    }

    # Handle preflight requests
    @options {
        method OPTIONS
    }
    respond @options 204

    # Logging
    log {
        output file /var/log/caddy/huggingface-mcp-access.log {
            roll_size 10MB
            roll_keep 10
            roll_keep_for 720h
        }
        format json
    }
}

# Alternative: Compact MCP endpoint
mcp-compact.ghostbridge.tech {
    reverse_proxy localhost:8080/mcp/compact {
        header_up Upgrade {>Upgrade}
        header_up Connection {>Connection}
        header_up X-Real-IP {remote}
        header_up X-Forwarded-For {remote}
        header_up X-Forwarded-Proto {scheme}
    }

    encode gzip zstd

    header {
        Access-Control-Allow-Origin "*"
        Access-Control-Allow-Methods "GET, POST, OPTIONS"
        Access-Control-Allow-Headers "Content-Type, Authorization"
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    }

    @options {
        method OPTIONS
    }
    respond @options 204
}

# Redirect www to non-www
www.mcp.ghostbridge.tech {
    redir https://mcp.ghostbridge.tech{uri}
}