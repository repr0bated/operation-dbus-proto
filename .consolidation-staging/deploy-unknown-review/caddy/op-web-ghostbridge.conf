# Caddy configuration for op-web.ghostbridge.tech
# Place this in /etc/caddy/conf.d/ or include in main Caddyfile

op-web.ghostbridge.tech {
    # Reverse proxy to op-web server (running on localhost:8080)
    reverse_proxy localhost:8080 {
        # WebSocket support for real-time chat
        header_up Upgrade {>Upgrade}
        header_up Connection {>Connection}
        
        # Forward real client IP
        header_up X-Real-IP {remote}
        header_up X-Forwarded-For {remote}
        header_up X-Forwarded-Proto {scheme}
        header_up X-Forwarded-Host {host}
    }

    # Enable compression
    encode gzip zstd

    # Security headers
    header {
        # Enable HSTS
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        # Prevent clickjacking
        X-Frame-Options "SAMEORIGIN"
        # XSS protection
        X-XSS-Protection "1; mode=block"
        # Content type sniffing
        X-Content-Type-Options "nosniff"
        # Referrer policy
        Referrer-Policy "strict-origin-when-cross-origin"
    }

    # Logging
    log {
        output file /var/log/caddy/op-web-ghostbridge-access.log {
            roll_size 10MB
            roll_keep 10
            roll_keep_for 720h
        }
        format json
    }

    # Handle static assets with caching
    @static {
        path *.css *.js *.png *.jpg *.jpeg *.gif *.svg *.woff *.woff2 *.ttf *.eot *.ico *.wasm
    }
    header @static {
        Cache-Control "public, max-age=86400, immutable"
    }
}

# Optional: Redirect www to non-www
www.op-web.ghostbridge.tech {
    redir https://op-web.ghostbridge.tech{uri}
}