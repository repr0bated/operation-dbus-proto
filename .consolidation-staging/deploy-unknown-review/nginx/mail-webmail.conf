# Mail Webmail Configuration
# Routes mail.3tched.com to SnappyMail webmail

server {
    listen 80;
    listen [::]:80;
    server_name mail.3tched.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name mail.3tched.com;

    ssl_certificate /etc/letsencrypt/live/3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3tched.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Redirect root to /mail page in the op-web app
    location = / {
        return 301 https://$host/mail;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Webmail specific settings
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_buffering off;
    }

    access_log /var/log/nginx/mail.3tched.com.access.log;
    error_log /var/log/nginx/mail.3tched.com.error.log;
}
