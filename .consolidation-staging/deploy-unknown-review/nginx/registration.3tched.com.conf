# Reverse proxy for registration.3tched.com
# Proxies to op-web on port 7010

server {
    listen 80;
    server_name registration.3tched.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name registration.3tched.com;

    # SSL Configuration (Cloudflare will handle SSL, but we keep it for direct access)
    ssl_certificate /etc/ssl/certs/registration.3tched.com.crt;
    ssl_certificate_key /etc/ssl/private/registration.3tched.com.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Proxy to op-web (magic link registration service)
    location / {
        proxy_pass http://127.0.0.1:7010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for chat features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout settings
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:7010/health;
        proxy_set_header Host $host;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://127.0.0.1:7010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Magic link verification (human readable)
    location /privacy/ {
        proxy_pass http://127.0.0.1:7010/privacy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Logging
    access_log /var/log/nginx/registration.3tched.com.access.log;
    error_log /var/log/nginx/registration.3tched.com.error.log;
}
