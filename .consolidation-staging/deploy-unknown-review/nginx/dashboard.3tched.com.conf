# /etc/nginx/sites-available/dashboard.3tched.com
# Proxy dashboard.3tched.com to OpenClaw gateway with token injection

# UPSTREAM: OpenClaw gateway inside 'services' container
upstream openclaw_backend {
    server 10.0.0.1:18789;  # OpenClaw gateway (not op-web)
    keepalive 32;
}

# UPSTREAM: Main op-web for other API calls
upstream opweb_backend {
    server 10.0.0.1:8081;  # op-web server
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.3tched.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/dashboard.3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.3tched.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # CORS for dashboard.3tched.com
    add_header Access-Control-Allow-Origin "https://dashboard.3tched.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-OP-MCP-Token" always;
    
    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ============================================
    # OPENCLAW API - Direct proxy with token injection
    # ============================================
    location /api/openclaw/ {
        proxy_pass http://openclaw_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # Pass client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # INSERT OPENCLAW TOKEN HERE
        # This authenticates requests to the OpenClaw gateway
        proxy_set_header Authorization "Bearer YOUR_OPENCLAW_TOKEN_HERE";
        
        # Timeout for long chat completions
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ============================================
    # OTHER API CALLS - Proxy to op-web
    # ============================================
    location /api/ {
        proxy_pass http://opweb_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass through client auth headers
        proxy_pass_header Authorization;
        proxy_pass_header X-API-Key;
        proxy_pass_header X-OP-MCP-Token;
    }

    # ============================================
    # STATIC/UI - Serve embedded UI or proxy to op-web
    # ============================================
    location / {
        proxy_pass http://opweb_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable WebSocket support for op-web
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.3tched.com;
    return 301 https://$server_name$request_uri;
}
