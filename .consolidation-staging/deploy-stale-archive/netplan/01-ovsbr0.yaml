# OVS bridge — netplan apply is the execution path.
# wgcf WireGuard tunnel managed by wg-quick (not netplan), then attached to OVS
# by ovs-attach-ports.sh via native OVSDB JSON-RPC.
network:
  version: 2
  renderer: networkd

  bridges:
    ovsbr0:
      interfaces: []
      addresses:
        - 148.113.204.83/32
      dhcp4: false
      dhcp6: false
      mtu: 1500
      openvswitch:
        controller:
          addresses:
            - tcp:10.200.0.1:6653
        external-ids:
          datapath-type: netdev
        fail-mode: standalone
        mcast-snooping: false
        rstp: false
        protocols:
          - OpenFlow13
