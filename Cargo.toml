[workspace]
resolver = "2"
members = ["crates/op-core"]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["OP-DBUS Contributors"]
license = "Apache-2.0"

# Preserve the upstream versions/features inherited by op-core.
[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"
anyhow = "1"
zbus = { version = "5", features = ["tokio"] }
