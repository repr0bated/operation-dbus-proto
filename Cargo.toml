[workspace]
resolver = "2"
members = [
    "crates/op-services",
    "crates/op-gateway",
    "crates/op-core",
    "crates/op-tools",
    "crates/op-introspection",
    "crates/op-chat",
    "crates/op-http",
    "crates/op-web",
    "crates/op-cache",
    "crates/op-state",
    "crates/op-state-store",
    "crates/op-jsonrpc",
    "crates/op-llm",
    "crates/op-network",
    "crates/op-inspector",
    "crates/op-agents",
    "crates/op-plugins",
    "crates/op-workflows",
    "crates/op-ml",
    "crates/op-blockchain",
    "crates/op-deployment",
    "crates/op-mcp",
    "crates/op-mcp-aggregator",
    "crates/op-mcp-proxy",
    "crates/op-identity",
    "crates/op-execution-tracker",
    "crates/op-dynamic-loader",
    "crates/op-cognitive-mcp",
    "crates/op-dbus-model",
    "crates/op-grpc-bridge",
    "crates/op-dbus-mirror",
    "crates/op-projection",
    "crates/op-procfs-plugin",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["OP-DBUS Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# Internal Crates
op-core = { path = "crates/op-core" }
op-tools = { path = "crates/op-tools" }
op-chat = { path = "crates/op-chat" }
op-http = { path = "crates/op-http" }
op-state = { path = "crates/op-state" }
op-network = { path = "crates/op-network" }
op-cache = { path = "crates/op-cache" }
op-introspection = { path = "crates/op-introspection" }
op-dbus-model = { path = "crates/op-dbus-model" }
op-execution-tracker = { path = "crates/op-execution-tracker" }
op-state-store = { path = "crates/op-state-store" }
op-plugins = { path = "crates/op-plugins" }
op-workflows = { path = "crates/op-workflows" }
op-blockchain = { path = "crates/op-blockchain" }
op-inspector = { path = "crates/op-inspector" }
op-mcp = { path = "crates/op-mcp" }
op-web = { path = "crates/op-web" }
op-grpc-bridge = { path = "crates/op-grpc-bridge" }
op-identity = { path = "crates/op-identity" }
op-dbus-mirror = { path = "crates/op-dbus-mirror" }
op-jsonrpc = { path = "crates/op-jsonrpc" }
op-projection = { path = "crates/op-projection" }
op-procfs-plugin = { path = "crates/op-procfs-plugin" }

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
simd-json = { version = "0.13", features = ["serde", "serde_impl"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
jsonschema = { version = "0.29", default-features = false }

# DBus
zbus = { version = "4.0", features = ["tokio"] }
zbus_xml = "4.0"

# Web
axum = { version = "0.7", features = ["ws", "macros", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1"
sha2 = "0.10"
base64 = "0.21"
libc = "0.2"
hex = "0.4"
parking_lot = "0.12"

# gRPC
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
tonic-reflection = "0.12"
tonic-health = "0.12"
tonic-web = "0.12"

# Databases
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
redis = { version = "0.25", features = ["tokio-comp"] }
lru = "0.12"

# Additional
clap = { version = "4", features = ["derive"] }
lazy_static = "1.4"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
rtnetlink = "0.14"
gethostname = "0.5"
num_cpus = "1.16"
tempfile = "3"
tar = "0.4"
flate2 = "1"
log = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
md5 = "0.7"
opentelemetry = { version = "0.22", features = ["metrics", "trace"] }
prometheus = { version = "0.13", features = ["process"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[package]
name = "op-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OP-DBUS: Native, Deterministic Control Plane for Linux Systems"
authors = ["OP-DBUS Contributors"]

[lib]
path = "root-package-src/lib.rs"

[[bin]]
name = "op-dbus"
path = "root-package-src/main.rs"

[[bin]]
name = "inspector-onboard"
path = "root-package-src/bin/inspector-onboard.rs"

[[bin]]
name = "microsoft-device-login"
path = "root-package-src/bin/microsoft-device-login.rs"

[features]
default = ["grpc"]
grpc = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
simd-json.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
async-trait.workspace = true
zbus.workspace = true
sqlx.workspace = true
chrono.workspace = true
base64.workspace = true
futures.workspace = true
regex.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde_json.workspace = true
jsonschema.workspace = true

op-cache.workspace = true
op-core.workspace = true
op-tools.workspace = true
op-network.workspace = true
op-introspection.workspace = true
op-dbus-model.workspace = true
op-execution-tracker.workspace = true
op-jsonrpc.workspace = true
op-state.workspace = true
op-state-store.workspace = true
op-plugins.workspace = true
op-workflows.workspace = true
op-blockchain.workspace = true
op-inspector.workspace = true
op-web.workspace = true
op-grpc-bridge.workspace = true
op-dbus-mirror.workspace = true
op-mcp.workspace = true

parking_lot = "0.12"
dashmap = "5.0"
bytes = "1.0"
hex = "0.4"
pin-project-lite = "0.2"
glob = "0.3"
libc = "0.2"

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic = { workspace = true }
tonic-reflection = { workspace = true }
tonic-web = { workspace = true }
rust-embed = { version = "8.0" }
mime_guess = "2.0"

[dev-dependencies]
tempfile.workspace = true
