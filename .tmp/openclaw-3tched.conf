server {
    listen 80;
    listen [::]:80;
    server_name openclaw.3tched.com;

    allow 97.221.194.121;
    deny all;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openclaw.3tched.com;

    allow 97.221.194.121;
    deny all;

    ssl_certificate /etc/letsencrypt/live/openclaw.3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.3tched.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        # OpenClaw gateway removed — trusted dev environment.
        # Return 503 until zero-trust gRPC bridge is wired.
        return 503 "OpenClaw gateway disabled. Use gRPC bridge directly.\n";
    }
}
