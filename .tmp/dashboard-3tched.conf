# dashboard.3tched.com - Static file serving (not embedded)
# Serves UI directly from filesystem

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.3tched.com;

    allow 97.221.194.121;
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.3tched.com;

    allow 97.221.194.121;
    deny all;

    ssl_certificate /etc/letsencrypt/live/3tched.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3tched.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Serve static files from ui directory
    root /home/jeremy/git/operation-dbus/crates/crates/op-web/ui/dist;
    index index.html;

    # API calls go to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Serve static files, fallback to index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
