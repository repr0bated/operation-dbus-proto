[package]
name = "op-benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
json-benchmark = { path = "../op-json-benchmark" }
serde = { version = "1.0", features = ["derive"] }
simd-json = { version = "0.13", features = ["serde", "serde_impl", "serde_impl"] }
sonic-rs = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
simd-json = { workspace = true }  # Only for comparison benchmarks