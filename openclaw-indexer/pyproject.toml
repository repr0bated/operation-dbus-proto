[project]
name = "openclaw-indexer"
version = "0.1.0"
description = "Code-aware indexing pipeline for op-dbus chatbot RAG"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "huggingface-hub>=0.25.0",
    "gitpython>=3.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pathspec>=0.12.0",
    "click>=8.1.0",
    "orjson>=3.10.0",
    "torch>=2.0.0",
    "pdfplumber>=0.11.0",
]

[project.scripts]
openclaw-index = "indexer.job:cli"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
