## Maddy Mail Server Configuration for Debian
## Simple setup for 3tched.com

# Primary domain
$(primary_domain) = 3tched.com

# Server hostname
$(hostname) = mail.3tched.com

# Hostname
hostname {env:MADDY_HOSTNAME:$(hostname)}

# TLS - disabled for internal use, enable for production
tls off

# SMTP submission (587) - for sending from op-web and mail clients
submission tcp://0.0.0.0:587 {
    limits {
        all rate 50 1m
        all concurrency 10
    }

    auth &local_authdb
    source &local_queue

    destination postmaster $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# SMTP (25) - for receiving mail from internet
smtp tcp://0.0.0.0:25 {
    limits {
        all rate 100 1m
        all concurrency 20
    }

    dmarc yes
    check {
        require_mx_record
        dkim
        spf
    }

    source &local_routing

    destination postmaster $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# IMAP (143) - for webmail and mail clients
imap tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
}

# Local mailbox storage
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /var/lib/maddy/imapsql.db
}

# Authentication
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn /var/lib/maddy/credentials.db
        table_name passwords
    }
}

# Message queue
queue.single_queue local_queue {
    target &remote_smtp
}

# Local delivery routing
msgpipeline local_routing {
    destination postmaster $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# Outbound delivery
target.remote outbound_delivery {
    limits {
        destination rate 10 1s
        destination concurrency 5
    }

    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir /var/lib/maddy/mtasts-cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}

# Remote SMTP delivery target reference
&remote_smtp = &outbound_delivery
