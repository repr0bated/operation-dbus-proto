## Maddy Mail Server Configuration
## Simple setup for 3tched.com

# Primary domain
$(primary_domain) = 3tched.com

# Server hostname (FQDN)
$(hostname) = mail.3tched.com

# Listen addresses
hostname {env:MADDY_HOSTNAME:$(hostname)}

# TLS configuration - using self-signed for now, replace with real certs
tls off

# SMTP submission (clients sending mail)
submission tcp://0.0.0.0:587 {
    limits {
        all rate 50 1m
        all concurrency 10
    }

    auth &local_authdb
    source &local_queue

    destination postmaster $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# SMTP relay (receiving mail from internet)
smtp tcp://0.0.0.0:25 {
    limits {
        all rate 100 1m
        all concurrency 20
    }

    dmarc yes
    check {
        require_mx_record
        dkim
        spf
    }

    source &local_routing

    destination postmaster $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# IMAP (webmail and clients accessing mailboxes)
imap tcp://0.0.0.0:143 {
    auth &local_authdb
    storage &local_mailboxes
}

# Local storage
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /var/lib/maddy/imapsql.db
}

# Authentication database
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}

# Message queue
queue.single_queue local_queue {
    target &remote_smtp
}

# Routing for local delivery
msgpipeline local_routing {
    destination postmaster $(primary_domain) {
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "User doesn't exist"
    }
}

# Remote SMTP delivery
remote_smtp: target.remote outbound_delivery {
    limits {
        destination rate 10 1s
        destination concurrency 5
    }

    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir /var/lib/maddy/mtasts-cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}
