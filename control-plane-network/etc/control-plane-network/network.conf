# Persistent control-plane network policy.
#
# This file is installed once and preserved on upgrades. Each boot reads it
# and reconciles live kernel/OVS/WireGuard state; the script does not regenerate
# this file. Keep it root-owned, regular (not a symlink), and not group/world
# writable. WireGuard private keys stay in /etc/wireguard, not here.

NODE_ROLE=main
BIRTHDAY=2026-07-11

STATE_DIR=/var/lib/control-plane-network
REPORT_DIR=/var/log/control-plane-network

# Bridge topology. ovsbr0 owns only its bridge identity. eth0 retains the
# provider address and service aliases while attached as an OVS "system" port;
# netmaker retains the mesh identities while attached the same way.
#
# BRIDGE_SYSTEM_PORTS are created/configured/attached together by one
# rovs_commands.ensure_bridge_ports D-Bus call and one OVSDB transaction.
#BRIDGE=ovsbr0
#BRIDGE_ADDRESSES="10.200.0.1/30"
#BRIDGE_DATAPATH=system
#BRIDGE_FAIL_MODE=standalone
#BRIDGE_SYSTEM_PORTS="eth0 netmaker"
#ROGUE_PORTS="ovsbr0-sock ovsbr0-mgmt gbr_wg gbr_warp gbr_xray"

# Provider uplink. A /32 on an off-subnet gateway gets an explicit on-link
# gateway host route before the default route is installed.
#UPLINK_NIC=eth0
#PUBLIC_IP=148.113.204.83/32
#PUBLIC_GW=148.113.204.1
#UPLINK_ALIASES="10.200.0.2/32 10.0.0.2/32"

# Static WireGuard mesh. The persistent source is
# /etc/wireguard/netmaker.conf; wg-quick is used only to strip/parse it.
#WIREGUARD_CONF_DIR=/etc/wireguard
#NETMAKER_IFACE=netmaker
#NETMAKER_ALIASES="10.0.0.3/32 100.90.37.254/32 fd3c:8a39:2d9e:9577:ffff:ffff:ffff:fffe/128"
#NETMAKER_ROUTES="10.0.0.0/24=10.0.0.3 100.90.37.0/24=100.90.37.254 fd3c:8a39:2d9e:9577::/64=fd3c:8a39:2d9e:9577:ffff:ffff:ffff:fffe"

# Controller assignment is an OVSDB mutation through
# rovs_commands.set_controller. Flow programming runs later in the separate
# control-plane-network-flows oneshot after op-of-controller-srv is ready.
#OF_CONTROLLER=tcp:10.200.0.1:6653
#OF_CONTROLLER_BUS=org.opdbus.of_controller
#FLOW_RETRY_ATTEMPTS=15
#FLOW_RETRY_PAUSE=1

# D-Bus projected plugin surface.
#PLUGIN_BUS=org.opdbus.v1.plugins
#ROVS_PATH=/org/opdbus/v1/plugins/rovs_commands
#OPENFLOW_PATH=/org/opdbus/v1/plugins/openflow
#UNIX_SOCKET_PATH=/org/opdbus/v1/plugins/unix_socket
#PROJECTED_IFACE=org.opdbus.v1.plugins.ProjectedObject

# Bounded readiness and command timeouts (seconds).
#DBUS_WAIT=120
#OVSDB_WAIT=60
#PLUGIN_BUS_WAIT=45
#CONTROLLER_WAIT=45
#BRIDGE_NETDEV_WAIT=10
#COMMAND_TIMEOUT=15
#GATEWAY_PROBE_ATTEMPTS=3
#GATEWAY_PROBE_TIMEOUT=2

# Persistently exclude the static uplink from dhcpcd. Set no only if another
# durable network manager is intentionally authoritative for UPLINK_NIC.
#TAME_DHCPCD=yes
#DHCPCD_CONF=/etc/dhcpcd.conf

# Optional post-bootstrap mesh reachability check. Empty/unset skips it.
#NETMAKER_PING_TARGET=10.0.0.2
