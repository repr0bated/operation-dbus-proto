# main or decoy
NODE_ROLE=main

BIRTHDAY=2026-07-11
SHORT_PAUSE=2
LONG_PAUSE=7

STATE_DIR=/var/lib/control-plane-network
REPORT_DIR=/var/log/control-plane-network

# Network layout (decided 2026-07-11): ovsbr0 has three ports —
#   eth0      physical NIC (enslaved, public IP moves to bridge)
#   netmaker  WG mesh iface (static /etc/wireguard/netmaker.conf, no
#             netclient; hub-and-spoke via oracle) + 10.0.0.2/32 alias
#   uplink    OVS internal port + 10.200.0.2/30
# The bridge itself keeps 10.200.0.1/30 + the public IP (148.113.204.83/32).
# OpenFlow controller at tcp:10.200.0.1:6653, fail_mode=standalone (switch to secure once controller service is running).
# netmaker is the ONLY WireGuard interface on the host.
#BRIDGE=ovsbr0
#BRIDGE_ADDRESSES="10.200.0.1/30"
#BRIDGE_FAIL_MODE=standalone
#UPLINK_NIC=eth0
#PUBLIC_IP=148.113.204.83/32
#PUBLIC_GW=148.113.204.1
#OF_CONTROLLER=tcp:10.200.0.1:6653
#ROGUE_PORTS="ovsbr0-sock ovsbr0-mgmt gbr_wg gbr_warp gbr_xray"
#UPLINK_PORT=uplink
#UPLINK_ADDR=10.200.0.2/30
#NETMAKER_IFACE=netmaker
#NETMAKER_ALIAS=10.0.0.2/32
