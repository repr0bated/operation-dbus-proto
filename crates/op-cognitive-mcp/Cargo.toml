[package]
name = "op-cognitive-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
op-core = { path = "../op-core" }
op-identity = { path = "../op-identity" }
op-mcp = { path = "../op-mcp" }
op-agents = { path = "../op-agents" }
op-state-store = { path = "../op-state-store" }
op-plugins = { path = "../op-plugins" }
op-dynamic-loader = { path = "../op-dynamic-loader" }
op-cache = { path = "../op-cache" }
op-cozo-store = { workspace = true }
hex = { workspace = true }
memmap2 = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
simd-json = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
anyhow = { workspace = true }
qdrant-client = "1.17"
reqwest = { workspace = true }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = { version = "0.7", features = ["json", "http2"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
clap = { workspace = true, features = ["env"] }
cozo = { workspace = true }

# gRPC (NotebookLM CognitiveToolService)
tonic = { workspace = true }
prost = { workspace = true }
tonic-reflection = { workspace = true }
tonic-health = { workspace = true }
tonic-web = { workspace = true }

# RAG pipeline
zip = "2"
sha2 = { workspace = true }
regex = { workspace = true }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Random for jitter
rand = "0.8"

# SSE streaming
async-stream = "0.3"
tokio-stream = "0.1"
reqwest-eventsource = "0.5"

# Examples
futures = "0.3"

# D-Bus
zbus = { workspace = true }

[[bin]]
name = "rag-ingest"
path = "src/bin/rag-ingest.rs"

[[bin]]
name = "op-cog-admin"
path = "src/bin/op-cog-admin.rs"

[build-dependencies]
tonic-build = { version = "0.12" }
