syntax = "proto3";

package assistant.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message Empty {}

message Error {
  int32 code = 1;
  string message = 2;
  optional google.protobuf.Struct details = 3;
}

message Pagination {
  uint32 limit = 1;
  uint32 offset = 2;
  string cursor = 3;
}
