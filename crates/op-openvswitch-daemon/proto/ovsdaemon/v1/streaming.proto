syntax = "proto3";

package ovsdaemon.v1;

// Streaming service for OVSDB and OpenFlow updates
// Provides server-streaming subscriptions that act as mutate triggers
// into the SchemaEngine per AGENTS.md architecture.
service OvsdbStreamService {
    // Subscribe to OVSDB database updates (monitor)
    // Returns a stream of table row changes
    rpc SubscribeOvsdbUpdates(SubscribeRequest) returns (stream OvsdbUpdate);

    // Subscribe to OpenFlow flow updates
    // Returns a stream of flow add/modify/delete events
    rpc SubscribeFlowUpdates(SubscribeRequest) returns (stream FlowUpdate);

    // Subscribe to bridge/port topology changes
    // High-level aggregated events for UI/consumers
    rpc SubscribeTopology(SubscribeRequest) returns (stream TopologyEvent);
}

// Request to subscribe to a specific database or stream
message SubscribeRequest {
    // Database name (e.g., "Open_vSwitch") or stream identifier
    string database = 1;

    // Optional: specific tables to monitor (empty = all tables)
    repeated string tables = 2;

    // Optional: filter expression for events
    string filter = 3;
}

// OVSDB update event - represents a row change in a table
message OvsdbUpdate {
    // Event timestamp (nanoseconds since epoch)
    int64 timestamp = 1;

    // Database name
    string database = 2;

    // Table name
    string table = 3;

    // UUID of the affected row
    string row_uuid = 4;

    // Update type
    enum UpdateType {
        UPDATE_TYPE_UNSPECIFIED = 0;
        INSERT = 1;
        MODIFY = 2;
        DELETE = 3;
    }
    UpdateType update_type = 5;

    // Row data as JSON string (full row for INSERT, changes for MODIFY, empty for DELETE)
    string row_json = 6;

    // Previous row data (for MODIFY/DELETE, if available)
    string previous_row_json = 7;
}

// OpenFlow flow update event
message FlowUpdate {
    // Event timestamp
    int64 timestamp = 1;

    // Connection handle identifier
    string connection_id = 2;

    // Datapath/bridge identifier
    string datapath_id = 3;

    // Flow cookie (if applicable)
    uint64 cookie = 4;

    // Update action
    enum FlowAction {
        FLOW_ACTION_UNSPECIFIED = 0;
        ADDED = 1;
        MODIFIED = 2;
        REMOVED = 3;
    }
    FlowAction action = 5;

    // Flow match criteria as JSON
    string match_json = 6;

    // Flow actions as JSON
    string actions_json = 7;

    // Priority
    uint32 priority = 8;

    // Idle timeout
    uint32 idle_timeout = 9;

    // Hard timeout
    uint32 hard_timeout = 10;

    // Full flow entry as JSON
    string flow_json = 11;
}

// High-level topology event for UI/consumers
message TopologyEvent {
    // Event timestamp
    int64 timestamp = 1;

    // Event type
    enum EventType {
        EVENT_TYPE_UNSPECIFIED = 0;
        BRIDGE_ADDED = 1;
        BRIDGE_REMOVED = 2;
        BRIDGE_MODIFIED = 3;
        PORT_ADDED = 4;
        PORT_REMOVED = 5;
        PORT_MODIFIED = 6;
        INTERFACE_UP = 7;
        INTERFACE_DOWN = 8;
        CONTROLLER_CONNECTED = 9;
        CONTROLLER_DISCONNECTED = 10;
    }
    EventType event_type = 2;

    // Object identifier (bridge name, port name, etc.)
    string object_id = 3;

    // Parent object (e.g., bridge name for port events)
    string parent_id = 4;

    // Event details as JSON
    string details_json = 5;
}

// Status request/response - imported from ovsdb.proto
// Reuse: StatusRequest, StatusResponse from ovsdaemon.v1 package
