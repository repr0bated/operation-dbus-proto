syntax = "proto3";

package ovsdaemon.v1;

// Base OVSDB service for bridge/port management
// Provides typed gRPC interface over OVSDB operations
service OvsdbService {
    // Bridge operations
    rpc CreateBridge(BridgeRequest) returns (BridgeResponse);
    rpc DeleteBridge(BridgeRequest) returns (BridgeResponse);
    rpc ListBridges(BridgesRequest) returns (BridgesResponse);

    // Port operations
    rpc AddPort(PortRequest) returns (PortResponse);
    rpc RemovePort(PortRequest) returns (PortResponse);
    rpc ListPorts(PortsRequest) returns (PortsResponse);

    // Database operations
    rpc ListDatabases(DatabaseRequest) returns (DatabaseResponse);

    // Port lifecycle for containers (openvswitch proxy)
    // Create an OVS internal port and move it into a container's netns
    rpc AttachPortToNetns(AttachPortRequest) returns (AttachPortResponse);
    // Return a port from a container's netns back to the host and remove it from OVS
    rpc DetachPortFromNetns(DetachPortRequest) returns (DetachPortResponse);

    // Status
    rpc GetStatus(StatusRequest) returns (StatusResponse);
}

// Bridge request/response
message BridgeRequest {
    string name = 1;
    string datapath_id = 2;
    map<string, string> options = 3;
}

message BridgeResponse {
    string name = 1;
    bool success = 2;
    string message = 3;
    string uuid = 4;
}

message BridgesRequest {
    // Optional filter
    string filter = 1;
}

message BridgesResponse {
    repeated string bridges = 1;
    int32 count = 2;
}

// Port request/response
message PortRequest {
    string name = 1;
    string bridge = 2;
    string interface_type = 3;  // system, internal, vxlan, etc.
    map<string, string> options = 4;
}

message PortResponse {
    string name = 1;
    string bridge = 2;
    bool success = 3;
    string message = 4;
    string uuid = 5;
}

message PortsRequest {
    string bridge = 1;
}

message PortsResponse {
    string bridge = 1;
    repeated string ports = 2;
    int32 count = 3;
}

// Database operations
message DatabaseRequest {
    // Empty or specific database name
    string database = 1;
}

message DatabaseResponse {
    repeated string databases = 1;
    int32 count = 2;
}

// Status
message StatusRequest {}

message StatusResponse {
    bool connected = 1;
    string version = 2;
    string message = 3;
}

// Openvswitch proxy: attach/detach OVS internal port to container netns
message AttachPortRequest {
    string port_name = 1;        // OVS internal port name (e.g. "wg-xray-net0")
    string bridge = 2;          // OVS bridge name (e.g. "ovsbr0")
    uint32 target_pid = 3;      // Container's PID (to find its netns)
    string iface_name = 4;      // Desired interface name inside container (e.g. "eth0")
    map<string, string> options = 5;  // Extra OVS Interface options
}

message AttachPortResponse {
    string port_name = 1;
    string bridge = 2;
    bool success = 3;
    string message = 4;
    string iface_name = 5;      // Final interface name inside container
}

message DetachPortRequest {
    string port_name = 1;       // OVS port name to remove
    string bridge = 2;          // OVS bridge name
}

message DetachPortResponse {
    string port_name = 1;
    string bridge = 2;
    bool success = 3;
    string message = 4;
}
