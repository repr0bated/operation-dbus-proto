[package]
name = "op-openvswitch-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "D-Bus daemon for OpenVSwitch management via native rovs primitives"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
simd-json = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
rtnetlink = { workspace = true }
netlink-packet-route = { workspace = true }

# D-Bus
zbus = { workspace = true }

# rovs ecosystem - native OVS primitives
rovs-ovsdb = "0.2"
rovs-openflow = "0.2"
rovs-jsonrpc = "0.2"
rovs-types = "0.2"
rovs-transport = "0.2"

# gRPC
tonic = { workspace = true }
tonic-web = { workspace = true }
tonic-reflection = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true, features = ["sync"] }

# Internal crates
op-core = { path = "../op-core" }
op-dbus-model = { path = "../op-dbus-model" }
op-identity = { path = "../op-identity" }

[build-dependencies]
tonic-build = { workspace = true }

[[bin]]
name = "op-openvswitch-daemon"
path = "src/main.rs"

[[bin]]
name = "ovs-attach"
path = "src/bin/ovs_attach.rs"
