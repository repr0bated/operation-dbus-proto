[package]
name = "op-plugins"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Plugin system with state management, domain plugins, and blockchain footprints"

[dependencies]
# Plugin schemas are derived from Rust state structs via schemars.
schemars = "1"
# Distributed plugin self-registration: each plugin module submits its
# name+constructor via inventory::submit!; the registry iterates them. This is
# the single source of the plugin catalog — no central dispatch list.
inventory = "0.3"
op-core = { path = "../op-core" }
# Sealed plugin-object blobs: the blob catalog IS the plugin surface.
op-blob = { workspace = true }
op-dbus-model = { workspace = true }
op-state = { path = "../op-state" }
op-state-store = { path = "../op-state-store" }
op-blockchain = { path = "../op-blockchain" }
op-network = { path = "../op-network" }
op-dynamic-loader = { path = "../op-dynamic-loader" }
op-execution-tracker = { path = "../op-execution-tracker" }
op-agents = { path = "../op-agents" }
# ZeroClaw base runtime types (schemars 1.x — matches this crate's schemars).
zeroclaw = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
zbus = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
md5 = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
dirs = "5.0"
toml = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }

[[bin]]
name = "opblob"
path = "src/bin/opblob.rs"
