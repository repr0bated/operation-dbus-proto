[package]
name = "op-plugin-lint"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Static audit of plugin .rs files against PLUGIN-RENDER-CONTRACT.md"

[[bin]]
name = "op-plugin-lint"
path = "src/main.rs"

[features]
default = []
# Optional: call live op_inspector::IntrospectiveGadget (needs workspace zbus).
# The deps have to be named here, not merely implied: the feature declared none,
# so anything enabling it — `--all-features` included — compiled `gadget.rs`
# against two crates this package never linked.
inspector-gadget = ["dep:op-inspector", "dep:tokio"]

[dependencies]
anyhow = { workspace = true }
op-inspector = { path = "../op-inspector", optional = true }
tokio = { workspace = true, optional = true }
clap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
thiserror = { workspace = true }
toml = { workspace = true }
