[package]
name = "op-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ML/Embedding support: model management, text embedder, vector storage"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
simd-json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
log = { workspace = true }
num_cpus = { workspace = true }
sha2 = { workspace = true }
hf-hub = { version = "0.5.0", features = ["tokio"] }
ndarray = { version = "0.17", features = ["std"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std"] }
once_cell = "1.21"
tokenizers = "0.21"

[features]
default = []
ml = ["ort/full"]
