[package]
name = "op-xray-daemon"
version = "0.1.0"
edition = "2021"
description = "D-Bus service for managing Xray proxy daemon lifecycle"
license = "MIT OR Apache-2.0"
authors = ["3tched Contributors"]
repository = "https://github.com/3tched/operation-dbus-proto"

[dependencies]
zbus = "4"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = { workspace = true }
chrono = "0.4"
tonic = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.4", features = ["util"] }

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "op-xray-daemon"
path = "src/main.rs"
