[package]
name = "zeroclaw-gui"
version = "0.1.0"
edition = "2021"
description = "Native Rust operator console for ZeroClaw"
authors = ["OP-DBUS Contributors"]
license = "Apache-2.0"

[[bin]]
name = "zeroclaw-gui"
path = "src/main.rs"

[dependencies]
# UI
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["svg"] }

# Serialization / schema-as-code
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

# gRPC client + tonic-web + reflection
tonic = { version = "0.12", features = ["transport", "tls", "codegen", "prost"] }
tonic-web = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
bytes = "1"

# Async runtime + transport
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http2", "tokio"] }
http = "1"
http-body-util = "0.1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
ehttp = { version = "0.5", features = ["native-async"] }
dirs-next = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Sealed plugin blobs — descriptor sets for the reflection registry.
op-blob = { path = "../op-blob" }
include_dir = { version = "0.7", optional = true }

[features]
default = []
# Finalise: compile pages/*.json into the binary and stop reading from disk.
embed-pages = ["dep:include_dir"]

[build-dependencies]
tonic-build = "0.12"
