[package]
name = "op-grpc-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bidirectional D-Bus <-> gRPC bridge with event chain integration"

[dependencies]
op-core = { workspace = true }
# gRPC
tonic = { workspace = true }
tonic-web = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tonic-reflection = { workspace = true }
tonic-health = { workspace = true }

# HTTP / middleware
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full", "sync"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }

# D-Bus
zbus = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
simd-json = { workspace = true }
schemars = { workspace = true }
jsonschema = { workspace = true }

# Internal crates
op-state-store = { path = "../op-state-store" }
op-state = { path = "../op-state" }
op-plugins = { path = "../op-plugins" }
op-identity = { path = "../op-identity" }
op-network = { path = "../op-network" }
op-jsonrpc = { path = "../op-jsonrpc" }
op-cognitive-mcp = { path = "../op-cognitive-mcp" }

# Zero-copy shared memory (1:1 Direct Read)
memmap2 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }

# Utilities
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = "0.3"
async-stream = "0.3"
base64 = "0.21"
qdrant-client = "1.17"
rcgen = "0.13"

[[bin]]
name = "op-grpc-bridge"
path = "src/bin/op-grpc-bridge.rs"

[[bin]]
name = "op-grpc-bridge-zeroclaw"
path = "src/bin/op-grpc-bridge-zeroclaw.rs"

[build-dependencies]
tonic-build = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = { workspace = true }

[[test]]
name = "zeroclaw_integration"
path = "tests/zeroclaw_integration.rs"
