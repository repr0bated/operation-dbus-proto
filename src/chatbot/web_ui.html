<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OP-DBUS Chatbot</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --border: #30363d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
        }
        
        .status-dot.disconnected { background: var(--accent-red); }
        
        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 0.5rem;
        }
        
        .message {
            margin-bottom: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            max-width: 80%;
        }
        
        .message.user {
            background: var(--accent);
            color: white;
            margin-left: auto;
        }
        
        .message.assistant {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }
        
        .message .tool-badge {
            display: inline-block;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.125rem 0.5rem;
            font-size: 0.75rem;
            font-family: monospace;
            margin-bottom: 0.5rem;
        }
        
        .message.user .tool-badge {
            display: none;
        }
        
        .message .content {
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .message .hash {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-family: monospace;
            margin-top: 0.5rem;
        }
        
        .input-container {
            display: flex;
            gap: 0.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        
        #message-input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }
        
        #message-input:focus {
            border-color: var(--accent);
        }
        
        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }
        
        .live-events {
            font-family: monospace;
            font-size: 0.75rem;
        }
        
        .live-event {
            padding: 0.5rem;
            margin-bottom: 0.25rem;
            background: var(--bg-tertiary);
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }
        
        .live-event.reasoning { border-left-color: #a371f7; }
        .live-event.tool_pending { border-left-color: #d29922; }
        .live-event.tool_complete { border-left-color: var(--accent-green); }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <h1>
            <span style="color: var(--accent);">OP-DBUS</span> Chatbot
        </h1>
        <div class="status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Connected</span>
        </div>
    </header>
    
    <main>
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message assistant">
                    <div class="tool-badge">system.init</div>
                    <div class="content">Welcome to OP-DBUS Chatbot. I am the cognitive brain of the system.

I will help you interact with tools and services. Every response I provide is executed through a tool - I never respond with plain descriptions.

How can I assist you today?</div>
                </div>
            </div>
            
            <div class="input-container">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Type a message..." 
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        
        <div class="sidebar">
            <h2>Live MCP Events</h2>
            <div class="live-events" id="live-events"></div>
        </div>
    </main>
    
    <script>
        const sessionId = crypto.randomUUID();
        let chatWs = null;
        let liveWs = null;
        
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const liveEventsEl = document.getElementById('live-events');
        
        function addMessage(content, isUser, toolName, hash) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            let html = '';
            if (toolName) {
                html += `<div class="tool-badge">${toolName}</div>`;
            }
            html += `<div class="content">${escapeHtml(content)}</div>`;
            if (hash && hash !== 'pending') {
                html += `<div class="hash">hash: ${hash.substring(0, 16)}...</div>`;
            }
            
            div.innerHTML = html;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function addLiveEvent(event) {
            const div = document.createElement('div');
            div.className = `live-event ${event.event_type}`;
            div.textContent = `[${event.event_type}] ${JSON.stringify(event.payload)}`;
            liveEventsEl.insertBefore(div, liveEventsEl.firstChild);
            
            // Keep only last 50 events
            while (liveEventsEl.children.length > 50) {
                liveEventsEl.removeChild(liveEventsEl.lastChild);
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function updateStatus(connected) {
            statusDot.className = `status-dot ${connected ? '' : 'disconnected'}`;
            statusText.textContent = connected ? 'Connected' : 'Disconnected';
        }
        
        function connectChatWs() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            chatWs = new WebSocket(`${protocol}//${location.host}/ws/chat/${sessionId}`);
            
            chatWs.onopen = () => updateStatus(true);
            chatWs.onclose = () => {
                updateStatus(false);
                setTimeout(connectChatWs, 3000);
            };
            chatWs.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'response') {
                    addMessage(data.message, false, 'user.respond', data.execution_hash);
                }
            };
        }
        
        function connectLiveWs() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            liveWs = new WebSocket(`${protocol}//${location.host}/ws/live`);
            
            liveWs.onclose = () => setTimeout(connectLiveWs, 3000);
            liveWs.onmessage = (e) => {
                const event = JSON.parse(e.data);
                addLiveEvent(event);
            };
        }
        
        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message) return;
            
            inputEl.value = '';
            addMessage(message, true);
            
            if (chatWs && chatWs.readyState === WebSocket.OPEN) {
                chatWs.send(message);
            } else {
                // Fallback to HTTP
                try {
                    const res = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: sessionId, message })
                    });
                    const data = await res.json();
                    addMessage(
                        data.message || 'No response',
                        false,
                        data.actions_taken && data.actions_taken.length > 0 ? data.actions_taken[0] : null,
                        null
                    );
                } catch (err) {
                    addMessage(`Error: ${err.message}`, false, 'system.error');
                }
            }
        }
        
        sendBtn.onclick = sendMessage;
        inputEl.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
        
        connectChatWs();
        connectLiveWs();
    </script>
</body>
</html>
