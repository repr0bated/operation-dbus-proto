mcpServers:
  - name: filesystem
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-filesystem"
      - /home/admin/git/odbus
  - name: memory
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-memory"
  - name: sequential-thinking
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-sequential-thinking"
  - name: fetch
    type: stdio
    command: npx
    args:
      - -y
      - "@modelcontextprotocol/server-fetch"
  - name: cognitive-mcp
    type: http
    url: http://10.200.0.2:3003/mcp
    headers:
      X-Ghostbridge-Footprint: mcp-client
      X-Ghostbridge-Trace-ID: mcp-add-project
  - name: op-dbus-compact
    type: http
    url: http://127.0.0.1:8080/mcp/compact
  - name: op-dbus-agents
    type: http
    url: http://127.0.0.1:8080/mcp/agents
  - name: op-cognitive-mcp
    type: stdio
    command: /usr/local/bin/op-cognitive-mcp
    args:
      - --stdio
  - name: op-web-compact
    type: stdio
    command: /usr/local/bin/op-mcp-server
    args:
      - --stdio
      - -m
      - compact
