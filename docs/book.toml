[book]
authors = ["OP-DBUS Contributors"]
language = "en"
src = "src"
title = "OP-DBUS Documentation"

[build]
build-dir = "book"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/Factory-AI/odbus"
edit-url-template = "https://github.com/Factory-AI/odbus/edit/main/docs/{path}"

[output.html.search]
enable = true
limit-results = 20
teaser-word-count = 30

[output.html.fold]
enable = true
level = 1

[output.linkcheck]
command = "mdbook-linkcheck2"
follow-web-links = false
warning-policy = "error"
