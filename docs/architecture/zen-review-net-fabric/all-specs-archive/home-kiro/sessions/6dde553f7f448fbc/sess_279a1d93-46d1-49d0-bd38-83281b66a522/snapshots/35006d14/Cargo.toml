[workspace]
resolver = "2"
members = [
    "crates/op-services",
    "crates/op-gateway",
    "crates/op-core",
    "crates/op-tools",
    "crates/op-introspection",
    "crates/op-chat",
    "crates/op-http",
    "crates/op-web",
    "crates/op-cache",
    "crates/op-state",
    "crates/op-state-store",
    "crates/op-blob",
    "crates/op-jsonrpc",
    "crates/op-llm",
    "crates/op-network",
    "crates/op-inspector",
    "crates/op-agents",
    "crates/op-plugins",
    "crates/op-plugin-lint",
    "crates/op-workflows",
    # "crates/op-ml",  # Disabled: ort API compatibility issues (see #ml-fixme)
    "crates/op-snowball",
    "crates/op-deployment",
    "crates/op-mcp",
    "crates/op-mcp-aggregator",
    "crates/op-identity",
    "crates/op-execution-tracker",
    "crates/op-dynamic-loader",
    "crates/op-cognitive-mcp",
    "crates/op-cozo-store",
    "crates/op-dbus-model",
    "crates/op-grpc-bridge",
    "crates/op-grpc-adapters",
    "crates/op-compliance",
    "crates/op-assistant-grpc",
    "crates/op-waypipe-grpc",
    "crates/op-s6-systemctl",
    "crates/op-xray-daemon",
    "crates/op-mcp-shim",
    "crates/op-gemma",
    "crates/op-gallery-gen",
    "crates/zeroclaw-gui",
    "crates/op-dbus-cli",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["OP-DBUS Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
# Internal Crates
op-core = { path = "crates/op-core" }
op-tools = { path = "crates/op-tools" }
op-chat = { path = "crates/op-chat" }
op-http = { path = "crates/op-http" }
op-state = { path = "crates/op-state" }
op-llm = { path = "crates/op-llm" }
op-network = { path = "crates/op-network" }
op-agents = { path = "crates/op-agents" }
op-cache = { path = "crates/op-cache" }
op-introspection = { path = "crates/op-introspection" }
op-dbus-model = { path = "crates/op-dbus-model" }
op-execution-tracker = { path = "crates/op-execution-tracker" }
op-state-store = { path = "crates/op-state-store" }
op-blob = { path = "crates/op-blob" }
op-plugins = { path = "crates/op-plugins" }
op-workflows = { path = "crates/op-workflows" }
op-snowball = { path = "crates/op-snowball" }
op-inspector = { path = "crates/op-inspector" }
op-mcp = { path = "crates/op-mcp" }
op-web = { path = "crates/op-web" }
op-grpc-bridge = { path = "crates/op-grpc-bridge" }
op-identity = { path = "crates/op-identity" }
op-jsonrpc = { path = "crates/op-jsonrpc" }
op-cozo-store = { path = "crates/op-cozo-store" }
op-s6-systemctl = { path = "crates/op-s6-systemctl" }
op-xray-daemon = { path = "crates/op-xray-daemon" }
op-gemma = { path = "crates/op-gemma" }

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
simd-json = { version = "0.13", features = ["serde", "serde_impl"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
jsonschema = { version = "0.29", default-features = false }
schemars = { version = "0.8", features = ["preserve_order"] }

# DBus
zbus = { version = "5", features = ["tokio"] }
zbus_xml = "5"

# Web
axum = { version = "0.7", features = ["ws", "macros", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# Vector DB
qdrant-client = "1.7"

# Graph DB — Datalog relational-graph-vector DB
# Cozo is the durable registry; RocksDB is its embedded persistence engine.
cozo = { version = "0.7.6", default-features = false, features = ["rayon", "storage-rocksdb"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utils
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1"
sha2 = "0.10"
base64 = "0.21"
libc = "0.2"
bytes = "1.0"
hex = "0.4"
memmap2 = "0.9"
parking_lot = "0.12"
dashmap = "5.0"
pin-project-lite = "0.2"
glob = "0.3"
mime_guess = "2.0"

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots", "tls-webpki-roots"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = "0.12"
tonic-reflection = "0.12"
prost-reflect = { version = "0.14", features = ["serde"] }
tonic-health = "0.12"
tonic-web = "0.12"

# Databases
rusqlite = { version = "0.37", features = ["bundled"] }
lru = "0.12"

# Additional
clap = { version = "4", features = ["derive"] }
lazy_static = "1.4"
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
rtnetlink = "0.14"
netlink-packet-route = "0.19"
gethostname = "0.5"
num_cpus = "1.16"
tempfile = "3"
tar = "0.4"
flate2 = "1"
bincode = "1.3"
log = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
md5 = "0.7"
blake3 = "1.5"
opentelemetry = { version = "0.22", features = ["metrics", "trace"] }
prometheus = { version = "0.13", features = ["process"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"

[package]
name = "op-dbus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OP-DBUS: Native, Deterministic Control Plane for Linux Systems"
authors = ["OP-DBUS Contributors"]

[features]
default = ["grpc"]
grpc = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
simd-json.workspace = true
sha2.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
async-trait.workspace = true
zbus.workspace = true
chrono.workspace = true
base64.workspace = true
futures.workspace = true
regex.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde_json.workspace = true
jsonschema.workspace = true

op-cache.workspace = true
op-core.workspace = true
op-tools.workspace = true
op-network.workspace = true
op-http.workspace = true
op-introspection.workspace = true
op-dbus-model.workspace = true
op-execution-tracker.workspace = true
op-jsonrpc.workspace = true
op-state.workspace = true
op-state-store.workspace = true
op-plugins.workspace = true
op-workflows.workspace = true
op-snowball.workspace = true
op-inspector.workspace = true
op-web.workspace = true
op-grpc-bridge.workspace = true
op-mcp.workspace = true
op-cognitive-mcp = { path = "crates/op-cognitive-mcp" }

parking_lot = "0.12"
dashmap = "5.0"
bytes = "1.0"
hex = "0.4"
pin-project-lite = "0.2"
glob = "0.3"
libc = "0.2"

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tonic = { workspace = true }
tonic-reflection = { workspace = true }
tonic-web = { workspace = true }
rust-embed = { version = "8.0" }
mime_guess = "2.0"

[dev-dependencies]
tempfile.workspace = true
