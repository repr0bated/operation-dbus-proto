name: Docs link check

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-link-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-link-check.yml'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --include-fragments
            'docs/**/*.md'
          fail: true
