name: codex full repository review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-full-repo-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pre-fetch pull request refs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "${{ github.event.pull_request.base.ref }}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head"

      - name: Run Codex full repository review
        id: run_codex
        if: env.OPENAI_API_KEY_PRESENT == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/full-repo-review.md
          output-file: codex-full-review.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

      - name: Upload review artifact
        if: env.OPENAI_API_KEY_PRESENT == 'true' && always() && hashFiles('codex-full-review.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codex-full-review
          path: codex-full-review.md

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: github.event_name == 'pull_request' && needs.codex.outputs.final_message != ''
    steps:
      - name: Upsert Codex review comment
        uses: actions/github-script@v7
        env:
          CODEX_REVIEW_BODY: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-full-repo-review -->';
            const body = [
              marker,
              '## Codex Full Repository Review',
              '',
              process.env.CODEX_REVIEW_BODY,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
