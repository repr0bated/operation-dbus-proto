name: Documentation build

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'crates/**'
      - '.github/workflows/docs.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'docs/**'
      - 'crates/**'
      - '.github/workflows/docs.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  mdbook:
    name: Build mdBook site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook tools
        run: cargo install mdbook mdbook-linkcheck2 mdbook-mermaid --locked

      - name: Build mdBook
        working-directory: docs
        run: mdbook build

  rustdoc:
    name: Build rustdoc API reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build workspace rustdoc
        run: cargo doc --workspace --no-deps
