[package]
name = "op-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
simd-json = { version = "0.13", features = ["serde", "serde_impl"] }
tokio = { version = "1.0", features = ["full"] }
json-benchmark = { path = "../op-json-benchmark" }
parser = { path = "../op-parser" }
storage = { path = "../op-storage" }
worker = { path = "../op-worker" }
colored = "2.1"
indicatif = "0.17"

# Removed serde_json - now using simd-json for all CLI operations