[package]
name = "op-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
simd-json = { version = "0.13", features = ["serde", "serde_impl"] }
tokio = { version = "1.0", features = ["full", "macros"] }
json-benchmark = { path = "../op-json-benchmark" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Removed serde_json - now using simd-json for all worker operations